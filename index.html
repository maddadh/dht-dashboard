<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wemos DHT22 Dashboard</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
    }

    h1 { font-size: 1.4rem; color: #94a3b8; letter-spacing: 0.05em; }

    .cards {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 36px 48px;
      text-align: center;
      min-width: 180px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    .card .label {
      font-size: 0.85rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }

    .card .value {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1;
    }

    .card .unit {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-top: 6px;
    }

    .temp .value { color: #f97316; }
    .hum  .value { color: #38bdf8; }

    #status {
      font-size: 0.8rem;
      padding: 6px 16px;
      border-radius: 99px;
      background: #1e293b;
    }

    #status.connected    { color: #4ade80; border: 1px solid #4ade80; }
    #status.disconnected { color: #f87171; border: 1px solid #f87171; }
    #status.connecting   { color: #fbbf24; border: 1px solid #fbbf24; }

    #last-updated {
      font-size: 0.75rem;
      color: #475569;
    }

    #debug {
      font-size: 0.7rem;
      color: #475569;
      font-family: monospace;
      background: #1e293b;
      padding: 8px 16px;
      border-radius: 8px;
      max-width: 480px;
      text-align: center;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <h1>🌡 Wemos DHT22 Live Dashboard</h1>

  <div class="cards">
    <div class="card temp">
      <div class="label">Temperature</div>
      <div class="value" id="temp-val">--</div>
      <div class="unit">°C</div>
    </div>
    <div class="card hum">
      <div class="label">Humidity</div>
      <div class="value" id="hum-val">--</div>
      <div class="unit">%</div>
    </div>
  </div>

  <div id="status" class="connecting">Connecting…</div>
  <div id="last-updated">Waiting for data…</div>
  <div id="debug">Initialising…</div>

  <script>
    // ── ⚠️ Fill in these two values ──────────────────────
    const MQTT_USER  = "dashboard";
    const MQTT_PASS  = "dashboard";
    // ─────────────────────────────────────────────────────

    const BROKER_HOST = "3dc8f5d766d54fe589cd5a6fa49fa47c.s1.eu.hivemq.cloud";
    const BROKER_PORT = 8884;   // if connection fails, try 8083
    const CLIENT_ID   = "dashboard-" + Math.random().toString(16).slice(2, 8);

    const TOPIC_TEMP  = "wemo-device/dht22/temperature";
    const TOPIC_HUM   = "wemo-device/dht22/humidity";

    const tempEl    = document.getElementById("temp-val");
    const humEl     = document.getElementById("hum-val");
    const statusEl  = document.getElementById("status");
    const updatedEl = document.getElementById("last-updated");
    const debugEl   = document.getElementById("debug");

    let retryCount = 0;

    function log(msg) {
      console.log("[MQTT]", msg);
      debugEl.textContent = msg;
    }

    const client = new Paho.Client(BROKER_HOST, Number(BROKER_PORT), "/mqtt", CLIENT_ID);

    client.onConnectionLost = (res) => {
      log("Connection lost: " + res.errorMessage);
      setStatus("disconnected", "Disconnected — retrying…");
      setTimeout(connect, 5000);
    };

    client.onMessageArrived = (message) => {
      const topic = message.destinationName;
      let payload;

      try {
        payload = JSON.parse(message.payloadString);
      } catch(e) {
        log("Bad payload on " + topic + ": " + message.payloadString);
        return;
      }

      if (topic === TOPIC_TEMP && payload.temp !== undefined) {
        tempEl.textContent = payload.temp.toFixed(1);
      }
      if (topic === TOPIC_HUM && payload.hum !== undefined) {
        humEl.textContent = payload.hum.toFixed(1);
      }

      updatedEl.textContent = "Last updated: " + new Date().toLocaleTimeString();
      log("Message received on " + topic + " → " + message.payloadString);
    };

    function connect() {
      retryCount++;
      setStatus("connecting", "Connecting… (attempt " + retryCount + ")");
      log("Connecting to " + BROKER_HOST + ":" + BROKER_PORT + " as " + MQTT_USER);

      client.connect({
        useSSL:            true,
        userName:          MQTT_USER,
        password:          MQTT_PASS,
        keepAliveInterval: 60,
        cleanSession:      true,
        onSuccess:         onConnect,
        onFailure: (err) => {
          log("FAILED — code: " + err.errorCode + " | " + err.errorMessage);
          setStatus("disconnected", "Connection failed (code " + err.errorCode + ") — retrying…");
          setTimeout(connect, 5000);
        }
      });
    }

    function onConnect() {
      retryCount = 0;
      setStatus("connected", "✅ Connected");
      log("Connected! Subscribing to topics…");

      client.subscribe(TOPIC_TEMP, {
        onSuccess: () => log("Subscribed to " + TOPIC_TEMP),
        onFailure: (e) => log("Subscribe failed: " + e.errorMessage)
      });
      client.subscribe(TOPIC_HUM, {
        onSuccess: () => log("Subscribed to " + TOPIC_HUM),
        onFailure: (e) => log("Subscribe failed: " + e.errorMessage)
      });
    }

    function setStatus(cls, text) {
      statusEl.className = cls;
      statusEl.textContent = text;
    }

    connect();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MQTT Test</title>
</head>
<body>
  <h1>MQTT Test</h1>
  <div id="status">Loading...</div>

  <script>
    console.log("Script started");
    document.getElementById("status").textContent = "Script running";
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"
    onload="console.log('✅ Paho loaded')"
    onerror="console.error('❌ Paho FAILED to load')">
  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"
    onload="console.log('✅ Chart.js loaded')"
    onerror="console.error('❌ Chart.js FAILED to load')">
  </script>

  <script>
    console.log("All scripts done");
    document.getElementById("status").textContent = "All scripts loaded — check console";
  </script>
</body>
</html>
